# =====================================================================
# SI Remuneration - application configuration
#
# The application only ever runs in the `dev` profile (see CLAUDE.md):
# in-memory H2 recreated at every launch, demo data, simulated external
# systems. PostgreSQL is the production target but production is never run.
# =====================================================================

quarkus.application.name=si-remuneration

# --- HTTP -------------------------------------------------------------
quarkus.http.root-path=/
quarkus.http.port=9010
# API documentation
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true

# --- Datasource / ORM -------------------------------------------------
# Production target is PostgreSQL; dev and test use H2 in PostgreSQL mode
# so the jsonb columns of section 5.7 stay portable between the two.
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=none
# jsonb columns (section 5.7) are stored as portable JSON; use Hibernate's own JSON
# handling rather than the REST formatting facilities.
quarkus.hibernate-orm.mapping.format.global=ignore
# Quote all identifiers so columns named after reserved words (e.g. "value") are portable
# between H2 and PostgreSQL.
quarkus.hibernate-orm.quote-identifiers.strategy=all

%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:remuneration;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=false

# Merge @QuarkusTest coverage into the Maven JaCoCo agent's data file.
%test.quarkus.jacoco.data-file=target/jacoco.exec
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:remuneration-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# --- Security ---------------------------------------------------------
# Real SSO is out of scope. In dev and test, users are declared in configuration with
# their directory groups (standing in for the directory); their roles and visible
# entities are deduced from the editable role_mapping table (section 3), so changing a
# mapping changes a user's rights at the next login (requirement ADM-01).
quarkus.http.auth.basic=true
quarkus.http.auth.permission.public.paths=/,/index.html,/assets/*,/favicon.ico,/api/test,/api/test/*,/q/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.api.paths=/api/ui/v1/*,/api/v1/*
quarkus.http.auth.permission.api.policy=authenticated

app.security.users.it-admin.password=it-admin
app.security.users.it-admin.groups=grp-it
app.security.users.auditor.password=auditor
app.security.users.auditor.groups=grp-audit
app.security.users.group-validator.password=group-validator
app.security.users.group-validator.groups=grp-group-validator

app.security.users.admin-alptis.password=admin-alptis
app.security.users.admin-alptis.groups=grp-ba-alptis,grp-op-alptis
app.security.users.admin2-alptis.password=admin2-alptis
app.security.users.admin2-alptis.groups=grp-ba-alptis,grp-op-alptis
app.security.users.operator-alptis.password=operator-alptis
app.security.users.operator-alptis.groups=grp-op-alptis
app.security.users.validator-alptis.password=validator-alptis
app.security.users.validator-alptis.groups=grp-bv-alptis
app.security.users.finance-alptis.password=finance-alptis
app.security.users.finance-alptis.groups=grp-fc-alptis
app.security.users.viewer-alptis.password=viewer-alptis
app.security.users.viewer-alptis.groups=grp-vw-alptis
app.security.users.manager-alptis.password=manager-alptis
app.security.users.manager-alptis.groups=grp-sm-alptis
app.security.users.rep-alptis.password=rep-alptis
app.security.users.rep-alptis.groups=grp-sr-alptis

app.security.users.admin-unep.password=admin-unep
app.security.users.admin-unep.groups=grp-ba-unep,grp-op-unep
app.security.users.operator-unep.password=operator-unep
app.security.users.operator-unep.groups=grp-op-unep
app.security.users.validator-unep.password=validator-unep
app.security.users.validator-unep.groups=grp-bv-unep
app.security.users.finance-unep.password=finance-unep
app.security.users.finance-unep.groups=grp-fc-unep
app.security.users.viewer-unep.password=viewer-unep
app.security.users.viewer-unep.groups=grp-vw-unep

# --- Single-page UI (Quinoa) -----------------------------------------
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist
quarkus.quinoa.package-manager-install=false
quarkus.quinoa.enable-spa-routing=true
# UI is built for dev packaging and exercised by the end-to-end suite;
# plain @QuarkusTest unit tests do not need it.
%test.quarkus.quinoa.enabled=false
